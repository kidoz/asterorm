[databases]
orm_test = host=postgres port=5432 dbname=orm_test user=orm_test password=orm_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = orm_test
pool_mode = transaction
max_prepared_statements = 0
default_pool_size = 2
min_pool_size = 2
reserve_pool_size = 0
server_round_robin = 1
server_reset_query =
max_client_conn = 20
