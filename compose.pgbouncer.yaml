services:
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1@sha256:3db3d7223e93af52b4116f642951a1a5fa44702a88c2a59cf7562cac19320c9e
    profiles: [pgbouncer]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:6432:5432"
    volumes:
      - ./tests/support/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./tests/support/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U orm_test -d orm_test"]
      interval: 2s
      timeout: 3s
      retries: 20
