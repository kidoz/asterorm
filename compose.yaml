services:
  postgres:
    image: postgres:16-alpine
    container_name: asterorm-test-db
    environment:
      POSTGRES_USER: orm_test
      POSTGRES_PASSWORD: orm_test
      POSTGRES_DB: orm_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orm_test -d orm_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    profiles: [mysql]
    environment:
      MYSQL_ROOT_PASSWORD: orm_root
      MYSQL_DATABASE: orm_test
      MYSQL_USER: orm_test
      MYSQL_PASSWORD: orm_test
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uorm_test -porm_test --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
